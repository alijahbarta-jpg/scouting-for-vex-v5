name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test skills snapshot generator
        run: python -m unittest discover -s scripts/tests -v
      - name: Refresh and commit skills snapshot
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          VEX_EVENTS_API_TOKEN: ${{ secrets.VEX_EVENTS_API_TOKEN }}
        run: |
          python scripts/refresh_skills_standings.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/skills-standings.csv
          if git diff --cached --quiet; then
            echo "Skills snapshot is unchanged."
          else
            git commit -m "Update VEX skills standings snapshot"
            git push
          fi
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build site
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
